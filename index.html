<!doctype html>
<html lang="en">
 <head> 
  <meta charset="utf-8"> 
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=no"> 
  <meta name="apple-mobile-web-app-capable" content="yes"> 
  <title>Monkey Mart</title> 
  <style type="text/css">
	body {
		position: fixed;
		margin:0;
		padding:0;
	}
	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}
	.canvas-app-container:-webkit-full-screen {
		width: auto;
		height: auto;
	}
	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
	}
	#canvas-container {
		position: relative;
	}
	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		ie-dummy: expression(this.hideFocus=true);
		-moz-outline-style: none;
	}
	div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-khtml-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}
	.canvas-app-progress {
		position: absolute;
		background-color: #0A8A40;
		height: 30px;
		margin-top: -30px;
		width: 100%;
	}
	.canvas-app-progress-bar {
		font-size: 12px;
		height: 30px;
		color: rgb(255, 255, 255);
		background-color: #FFE333;
		text-align: center;
		line-height: 20px;
	}
	body {
		background-color: #ffffff;
	}
	.canvas-app-container {
		background: #00BB61;
	}
	.canvas-app-canvas {
		background-repeat: no-repeat;
		background-position: center;
		background-position: top;
		background-size: cover;
		background-image: url("bg_loading.png");
	}
  </style> 
  <script src="patch/js/poki-sdk.js"></script>
 </head> 
 <body> 
  <div id="app-container" class="canvas-app-container"> 
   <div id="canvas-container" class="canvas-app-canvas-container"> 
    <canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="960" height="640"></canvas> 
   </div> 
   <div class="buttons-background"></div> 
   <div id="progress-bar-root" style="position: absolute; bottom: 16%; left: 50%; visibility: hidden; z-index: 4;"> 
    <img id="progress-bar-bg" src="load_bar_bg.png"> 
    <img id="progress-bar-fg" src="load_bar_fg.png" style="position:absolute; clip: rect(0px,0px,0px,0px);"> 
   </div> 
  </div> 
  <script id="engine-loader" type="text/javascript" src="dmloader.js"></script> 
  <script id="engine-setup" type="text/javascript">
	function _HashSHA1(key) {
		function rotate_left(n,s) { return ( n<<s ) | (n>>>(32-s)); }
		function cvt_hex(val) {
			var str=""; var i; var v;
			for( i=7; i>=0; i-- ) { v=(val>>>(i*4))&0x0f; str+=v.toString(16); }
			return str;
		}
		var blockstart;
		var i, j;
		var W = new Array(80);
		var H0 = 0x67452301;
		var H1 = 0xEFCDAB89;
		var H2 = 0x98BADCFE;
		var H3 = 0x10325476;
		var H4 = 0xC3D2E1F0;
		var A, B, C, D, E;
		var temp;
		var str_len = key.length;
		var word_array = [];
		for( i=0; i<str_len-3; i+=4 ) {
			j = key.charCodeAt(i)<<24 | key.charCodeAt(i+1)<<16 | key.charCodeAt(i+2)<<8 | key.charCodeAt(i+3);
			word_array.push( j );
		}
		switch( str_len % 4 ) {
			case 0: i = 0x080000000; break;
			case 1: i = key.charCodeAt(str_len-1)<<24 | 0x0800000; break;
			case 2: i = key.charCodeAt(str_len-2)<<24 | key.charCodeAt(str_len-1)<<16 | 0x08000; break;
			case 3: i = key.charCodeAt(str_len-3)<<24 | key.charCodeAt(str_len-2)<<16 | key.charCodeAt(str_len-1)<<8 | 0x80; break;
		}
		word_array.push( i );
		while( (word_array.length % 16) != 14 ) word_array.push( 0 );
		word_array.push( str_len>>>29 );
		word_array.push( (str_len<<3)&0x0ffffffff );
		for ( blockstart=0; blockstart<word_array.length; blockstart+=16 ) {
			for( i=0; i<16; i++ ) W[i] = word_array[blockstart+i];
			for( i=16; i<=79; i++ ) W[i] = rotate_left(W[i-3] ^ W[i-8] ^ W[i-14] ^ W[i-16], 1);
			A = H0; B = H1; C = H2; D = H3; E = H4;
			for( i= 0; i<=19; i++ ) { temp = (rotate_left(A,5) + ((B&C) | (~B&D)) + E + W[i] + 0x5A827999) & 0x0ffffffff; E = D; D = C; C = rotate_left(B,30); B = A; A = temp; }
			for( i=20; i<=39; i++ ) { temp = (rotate_left(A,5) + (B ^ C ^ D) + E + W[i] + 0x6ED9EBA1) & 0x0ffffffff; E = D; D = C; C = rotate_left(B,30); B = A; A = temp; }
			for( i=40; i<=59; i++ ) { temp = (rotate_left(A,5) + ((B&C) | (B&D) | (C&D)) + E + W[i] + 0x8F1BBCDC) & 0x0ffffffff; E = D; D = C; C = rotate_left(B,30); B = A; A = temp; }
			for( i=60; i<=79; i++ ) { temp = (rotate_left(A,5) + (B ^ C ^ D) + E + W[i] + 0xCA62C1D6) & 0x0ffffffff; E = D; D = C; C = rotate_left(B,30); B = A; A = temp; }
			H0 = (H0 + A) & 0x0ffffffff;
			H1 = (H1 + B) & 0x0ffffffff;
			H2 = (H2 + C) & 0x0ffffffff;
			H3 = (H3 + D) & 0x0ffffffff;
			H4 = (H4 + E) & 0x0ffffffff;
		}
		temp = cvt_hex(H0) + cvt_hex(H1) + cvt_hex(H2) + cvt_hex(H3) + cvt_hex(H4);
		return temp.toLowerCase();
	}

	var DMSYS = DMSYS || {};
	DMSYS.GetUserPersistentDataRoot = function() { return "/MonkeyMart_data"; };

	var extra_params = {
		archive_location_filter: function( path ) {
			return ("archive" + path + "");
		},
		engine_arguments: ["--verify-graphics-calls=false",],
		custom_heap_size: 134217728,
		full_screen_container: "#canvas-container",
		disable_context_menu: true
	}

	Module['INITIAL_MEMORY'] = extra_params.custom_heap_size;

	Module['onRuntimeInitialized'] = function() {
		Module.runApp("canvas", extra_params);
	};

	Module["locateFile"] = function(path, scriptDirectory)
	{
		if (path == "dmengine.wasm" || path == "dmengine_release.wasm" || path == "dmengine_headless.wasm") {
			path = "MonkeyMart.wasm";
		}
		return scriptDirectory + path;
	};

	var is_iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
	var buttonHeight = 0;
	var prevInnerWidth = -1;
	var prevInnerHeight = -1;

	function resize_game_canvas() {
		if (is_iOS) {
			window.scrollTo(0, 0);
		}
		var app_container = document.getElementById('app-container');
		var game_canvas = document.getElementById('canvas');
		var progress_bar_root = document.getElementById('progress-bar-root');
		var progress_bar_fg = document.getElementById('progress-bar-fg');
		var progress_bar_bg = document.getElementById('progress-bar-bg');
		var innerWidth = window.innerWidth;
		var innerHeight = window.innerHeight - buttonHeight;
		if (prevInnerWidth == innerWidth && prevInnerHeight == innerHeight)
		{
			return;
		}
		prevInnerWidth = innerWidth;
		prevInnerHeight = innerHeight;
		var width = 960;
		var height = 640;
		width = innerWidth;
		height = innerHeight;
		app_container.style.width = width + "px";
		app_container.style.height = height + buttonHeight + "px";
		game_canvas.width = width;
		game_canvas.height = height;
		var bar_h = width < height ? width:height;
		progress_bar_bg.width = Math.min(Math.ceil(bar_h * 0.06 * 300/24),width * 0.8);
		progress_bar_bg.style.marginLeft = - progress_bar_bg.width/2 + "px";
		progress_bar_fg.width =  Math.ceil(progress_bar_bg.width * 1);
		progress_bar_fg.style.marginTop = (progress_bar_bg.width * 0) * (0)/2 + "px";
		progress_bar_fg.style.marginLeft = -progress_bar_bg.width/2 - progress_bar_fg.width/2 + "px";
		progress_bar_root.style.bottom = Math.ceil(height*0.08 + buttonHeight) + "px";
	}
	resize_game_canvas();
	window.addEventListener('resize', resize_game_canvas, false);
	window.addEventListener('orientationchange', resize_game_canvas, false);
	window.addEventListener("keydown", function(e) {
		if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
			e.preventDefault();
		}
	}, false);
	window.addEventListener('focus', resize_game_canvas, false);

	var old_preloadAndCallMain = Module._preloadAndCallMain;
	Module._preloadAndCallMain = function () {
		var dir = DMSYS.GetUserPersistentDataRoot();
		var resDir = _HashSHA1("MonkeyMart");
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.arcd"); } catch (e) {}
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.arci"); } catch (e) {}
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.arcd.tmp"); } catch (e) {}
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.arci.tmp"); } catch (e) {}
		try { FS.unlink(dir + "/." + resDir + "/liveupdate.ref"); } catch (e) {}
		old_preloadAndCallMain();
	};
  </script> 
  <script id="engine-start" type="text/javascript">
		var currentPercentage = 0

		Progress.updateProgress = function(percentage) {
			Progress.notifyListeners(percentage);
			if(currentPercentage>percentage){
				percentage = currentPercentage
			}
			currentPercentage = percentage

			var fg = document.getElementById('progress-bar-fg');
			fg.style.clip="rect(0px,"  + fg.width * percentage/100 + "px,"  + fg.height+"px," + "0px)"

			if(isNaN(percentage)){
				var progress_bar_root = document.getElementById('progress-bar-root');
				progress_bar_root.style.visibility = "hidden";
			}
		};
		Progress.addProgress = function (){
			var progress_bar_root = document.getElementById('progress-bar-root');
			progress_bar_root.style.visibility = "visible"
		}
		Progress.removeProgress = function () {
			var progress_bar_root = document.getElementById('progress-bar-root');
			progress_bar_root.style.visibility = "hidden";
			Module.canvas.style.background = "";
		}

		EngineLoader.stream_wasm = "false" === "true";
		EngineLoader.load("canvas", "MonkeyMart");
  </script> 
  <script id="poki-sdk-setup" type="text/javascript">
		// Poki SDK disabled for self-hosted version
  </script>
 </body>
</html>
